services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bseo
      POSTGRES_PASSWORD: bseo
      POSTGRES_DB: bseo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bseo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # P0-02: one-shot migration runner. api/worker wait for it to complete
  # successfully, so the schema lands exactly once before anything boots.
  # (runMigrations() is also advisory-locked, so a concurrent boot-time run
  # can never race it.)
  migrate:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://bseo:bseo@postgres:5432/bseo
      REDIS_URL: redis://redis:6379
    command: ["node", "dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://bseo:bseo@postgres:5432/bseo
      REDIS_URL: redis://redis:6379
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://bseo:bseo@postgres:5432/bseo
      REDIS_URL: redis://redis:6379
    command: ["node", "dist/worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node --input-type=module -e \"const{Redis}=await import('ioredis');const r=new Redis(process.env.REDIS_URL||'redis://redis:6379',{lazyConnect:true});await r.ping();await r.quit();\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./frontend
      args:
        # Build-time override only (non-proxied deploys): bakes an absolute
        # API URL into the client bundle. Empty (default) => the browser
        # uses same-origin relative URLs, proxied at runtime by
        # app/api/[...path]/route.ts — no rebuild needed to change the API
        # target.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    env_file: .env
    environment:
      # Runtime /api proxy target, read per request by
      # app/api/[...path]/route.ts. Compose-internal hostname; the browser
      # never sees this value. (NEXT_PUBLIC_API_URL is kept as a fallback
      # by the route for the old runtime-only pattern.)
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:4000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
