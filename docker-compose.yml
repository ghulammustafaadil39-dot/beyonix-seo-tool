# S-10: hardened compose.
# - Images digest-pinned (multi-arch manifest lists, 2026-10-11).
# - postgres/redis expose NO ports to the host (compose-internal only).
# - Redis requires auth (REDIS_PASSWORD); postgres password comes from the
#   environment (POSTGRES_PASSWORD) — no credentials committed here.
#   Both are `:?`-guarded: compose fails fast when they are missing.
# - App services run read-only (tmpfs for /tmp) with CPU/memory limits.
# Required in .env (see .env.example): POSTGRES_PASSWORD, REDIS_PASSWORD,
# JWT_SECRET, ENCRYPTION_KEY (or ENCRYPTION_KEYS).
services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: bseo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: bseo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bseo"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 1G }

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    # S-10: auth required. The :? guard fails compose up fast without it.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }

  # P0-02: one-shot migration runner. api/worker wait for it to complete
  # successfully, so the schema lands exactly once before anything boots.
  # (runMigrations() is also advisory-locked, so a concurrent boot-time run
  # can never race it.)
  migrate:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://bseo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/bseo
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
    command: ["node", "dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp"]
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 512M }

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://bseo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/bseo
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs: ["/tmp"]
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 1G }

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://bseo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/bseo
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
    command: ["node", "dist/worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node --input-type=module -e \"const{Redis}=await import('ioredis');const r=new Redis(process.env.REDIS_URL||'redis://redis:6379',{lazyConnect:true});await r.ping();await r.quit();\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs: ["/tmp"]
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 2G }

  web:
    build:
      context: ./frontend
      args:
        # Build-time override only (non-proxied deploys): bakes an absolute
        # API URL into the client bundle. Empty (default) => the browser
        # uses same-origin relative URLs, proxied at runtime by
        # app/api/[...path]/route.ts — no rebuild needed to change the API
        # target.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    env_file: .env
    environment:
      # FIX (Oct 2026, bug #1): pin the web port. .env sets PORT=4000 for the
      # API and env_file would leak it into web, overriding the Dockerfile's
      # PORT=3000 while compose maps 3000:3000 -> dead web. environment:
      # entries win over env_file.
      PORT: 3000
      # Runtime /api proxy target, read per request by
      # app/api/[...path]/route.ts. Compose-internal hostname; the browser
      # never sees this value. (NEXT_PUBLIC_API_URL is kept as a fallback
      # by the route for the old runtime-only pattern.)
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:4000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp"]
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 1G }

volumes:
  pgdata:
  redisdata:
