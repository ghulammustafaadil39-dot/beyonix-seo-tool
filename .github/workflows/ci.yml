# Wave 3 Q-02: main CI pipeline — lint + typecheck + tests (PG/Redis
# services) + frontend build + npm audit + secret scan + migration dry-run +
# Trivy (config only; this env has no Docker daemon).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  backend-lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: TypeScript strict (noEmit)
        run: npx tsc --noEmit
        working-directory: backend

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bseo
          POSTGRES_PASSWORD: ci_pw
          POSTGRES_DB: bseo_test_ci
        options: >-
          --health-cmd "pg_isready -U bseo"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports:
          - 6379:6379
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://bseo:ci_pw@localhost:5432/bseo_test_ci
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-that-is-long-enough-0123456789abcdef
      ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
      MOCK_WEBHOOK_SECRET: ci-mock-webhook-secret
      STRIPE_SECRET_KEY: sk_test_ci_fake_000000000000000000000000
      STRIPE_WEBHOOK_SECRET: whsec_ci_fake_000000000000000000000000
      STRIPE_PRICE_STARTER: price_ci_starter
      STRIPE_PRICE_GROWTH: price_ci_growth
      STRIPE_PRICE_PRO: price_ci_pro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Backend tests (unit + integration + integration-stripe)
        run: npm test
        working-directory: backend
      - name: Backend tests coverage (core modules, >=85% gate)
        run: npm run test:coverage
        working-directory: backend
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: frontend
      - name: Next.js production build
        run: npm run build
        working-directory: frontend

  migration-dry-run:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bseo
          POSTGRES_PASSWORD: ci_pw
          POSTGRES_DB: bseo_migrate_ci
        options: >-
          --health-cmd "pg_isready -U bseo"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://bseo:ci_pw@localhost:5432/bseo_migrate_ci
      JWT_SECRET: ci-jwt-secret-that-is-long-enough-0123456789abcdef
      ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Build + run one-shot migration against a wiped database
        run: |
          npm run build
          node dist/migrate.js
          node -e "const {Pool}=require('pg');const p=new Pool({connectionString:process.env.DATABASE_URL});p.query('SELECT COUNT(*)::int c FROM migrations').then(r=>{console.log('migrations applied:',r.rows[0].c);return p.end();})"
        working-directory: backend

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
        working-directory: backend
      - name: npm audit (backend)
        run: npm audit --audit-level=high
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - name: npm audit (frontend)
        run: npm audit --audit-level=high
        working-directory: frontend

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bseo
          POSTGRES_PASSWORD: ci_pw
          POSTGRES_DB: bseo_e2e_ci
        options: >-
          --health-cmd "pg_isready -U bseo"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports:
          - 6379:6379
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://bseo:ci_pw@localhost:5432/bseo_e2e_ci
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-that-is-long-enough-0123456789abcdef
      ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
      MOCK_WEBHOOK_SECRET: ci-mock-webhook-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: API-level journey tests (wave2 suites)
        run: |
          cd backend && npm ci
          npx vitest run --project integration tests/wave2/journey-core.test.ts
      - name: Install Playwright browsers
        run: |
          cd frontend && npm ci
          npx playwright install --with-deps chromium
      - name: Start API + web, run browser E2E journeys
        run: |
          set -e
          cd backend && npm ci
          npm run build && (node dist/index.js & echo $! > /tmp/api.pid)
          # Migrations run at API boot; seed the demo account journey 1 logs in with.
          npm run seed
          cd ../frontend && npm ci
          npx playwright install --with-deps chromium
          (npm run build && npm run start & echo $! > /tmp/web.pid)
          sleep 10
          curl -sf http://localhost:4000/healthz
          curl -sf http://localhost:3000/ > /dev/null
          # Real browser journeys: backend/tests/e2e/journeys.mjs (playwright-core
          # script — exits non-zero on any journey failure; NOT the old vacuous
          # `npx playwright test || echo` swallow). --no-save keeps it test-only;
          # NODE_PATH lets the backend-located script resolve the package.
          npm install --no-save playwright-core
          set +e
          NODE_PATH="$PWD/node_modules" node ../backend/tests/e2e/journeys.mjs
          E2E_STATUS=$?
          set -e
          kill $(cat /tmp/api.pid) $(cat /tmp/web.pid) || true
          exit $E2E_STATUS
