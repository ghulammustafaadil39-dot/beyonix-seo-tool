# S-10: Trivy vulnerability scan for both production images.
# Runs on every push/PR to main and weekly (Monday 06:00 UTC) so newly
# disclosed CVEs in base images or dependencies are caught even without
# code changes. Wave 3 runs this workflow — it has NOT been executed in
# this environment (no Docker daemon here).
name: trivy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: ./backend
            image: bseo-backend
          - context: ./frontend
            image: bseo-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.image }}
        run: docker build -t ${{ matrix.image }}:${{ github.sha }} ${{ matrix.context }}

      - name: Trivy scan (${{ matrix.image }})
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.image }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: HIGH,CRITICAL
          exit-code: '0' # report-only; the Security tab shows the findings

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}
